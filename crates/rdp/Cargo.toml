[package]
name = "rumstsc-rdp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Independent RDP wire protocol with TLS, CredSSP, bitmap caching and RDPGFX/AVC420"

[dependencies]
rumstsc-video = { path = "../video" }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"
md-5 = "0.10"
md4 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
rsa = "0.9"
x509-parser = "0.17"
zeroize = "1.8"
subtle = "2.6"

[dev-dependencies]
rcgen = "0.13"
