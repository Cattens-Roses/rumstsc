[package]
name = "rumstsc-display"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native embedded remote-desktop framebuffer, independent of GPUI"
[dependencies]
rumstsc-rdp = { path = "../rdp" }
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse"] }
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["render"] }
