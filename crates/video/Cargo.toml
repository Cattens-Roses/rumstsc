[package]
name = "rumstsc-video"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Small system FFmpeg H.264 decoder bridge; no RDP protocol code"
[dependencies]
libloading = "0.8.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole"] }
